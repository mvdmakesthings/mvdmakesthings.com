- slug: ephemeris
  title: Ephemeris
  summary: A Swift framework for satellite tracking. It parses Two-Line Element data and works out where Earth-orbiting satellites are.
  stack: [Swift]
  status: active
  links:
    source: https://github.com/mvdmakesthings/Ephemeris
  spec: |
    Built to do two jobs: a practical library for iOS and macOS apps that track
    satellites, and a teaching tool for learning orbital mechanics by reading the code.

- slug: mercator
  title: Mercator
  summary: A Tree-sitter toolkit that turns source repositories into code quality metrics and maps of their structure.
  stack: [Python, Tree-sitter, Pydantic]
  status: active
  links:
    source: https://github.com/mvdmakesthings/mercator
  spec: |
    Parses C#, JavaScript, TypeScript, Python, and Ruby into syntax trees, then
    measures them: more than 80 metrics, from cyclomatic complexity to coupling,
    plus dependency graphs, documentation coverage, and code smells. Runs as a CLI
    or a Python module, in parallel, and skips files it has already analyzed.

- slug: compass
  title: Compass
