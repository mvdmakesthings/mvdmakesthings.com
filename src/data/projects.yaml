- slug: groundwerk
  title: Groundwerk
  summary: AI strategy tools for founders. Each one interviews you, pushes back on thin answers, and writes a document that has passed its own quality gates.
  stack: [Python, FastAPI, LangGraph, React, Postgres, Vercel]
  status: active
  links:
    live: https://groundwerk.mvdmakesthings.com
  image: groundwerk.png
  spec: |
    Two tools so far, brand strategy and business model, running on one engine.
    Each is an agent that asks its questions, follows up when an answer is weak,
    and writes a document that has to pass its own quality gates before you see it.
    A FastAPI backend serves the agent graphs; the front end is React.


