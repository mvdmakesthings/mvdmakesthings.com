  stack: [TypeScript]
  status: active

- slug: coopcam
  title: CoopCam
  summary: A two-device bird camera. It photographs birds at the feeder, identifies them on the device, and sends the result to a touchscreen over ESP-NOW, no router needed.
  stack: [ESP32-S3, PlatformIO, TFLite Micro, LVGL]
  status: active
  links:
    source: https://github.com/mvdmakesthings/coopcam
  spec: |
    "I wanna identify birds at the bird feeder, remotely." The camera unit is a
    XIAO ESP32S3 Sense running a TensorFlow Lite Micro classifier; the display is a
    SenseCAP Indicator with a 4-inch touchscreen. Both firmwares build from one
    PlatformIO config.

