    itch: https://mvdmakesthings.itch.io/plane-poultry-panic
  image: plane-poultry-panic.png


- slug: ephemeris
  title: Ephemeris
  summary: A Swift framework for satellite tracking. It parses Two-Line Element data and works out where Earth-orbiting satellites are.
  stack: [Swift]
  status: active
  links:
    source: https://github.com/mvdmakesthings/Ephemeris
  spec: |
    Built to do two jobs: a practical library for iOS and macOS apps that track
    satellites, and a teaching tool for learning orbital mechanics by reading the code.


- slug: refinery-hair-lounge
  title: The Refinery Hair Lounge
  summary: A custom WordPress site for a Louisville hair salon, with a stylist directory the salon manages itself and a pipeline that deploys it.
  stack: [WordPress, PHP, Secure Custom Fields, GitHub Actions, Terraform]
  status: client
  links:
    live: https://therefineryhairlounge.com
  image: refinery-hair-lounge.png
  spec: |
    Client work. A dark, editorial theme built from scratch around a stylist
    custom post type: headshot, bio, contact details, socials, online booking,
    and whether they are taking new clients. Staging and production deploy from
    GitHub Actions, with the hosting defined in Terraform.
