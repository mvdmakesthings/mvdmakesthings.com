title: Hello, Hun
medium: Phone installation with recorded interview
year: 2024
caption: >-
  My great-grandmother, Isabelle June Barrett, was 95 when I interviewed her about
  loss, grief, community, and keeping a positive mindset. Hello, Hun shares excerpts
  of her stories through a phone installation, shown in the Echos of Endings group
  show at Aurora Gallery.
